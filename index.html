<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Project</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <span class="user-greeting"
          >Вітаємо, <span id="user-name-display">Гість</span>!</span
        >
        <button id="theme-toggle">Змінити тему</button>
        <div class="dropdown">
          <button class="dropbtn">Інтерактив ▼</button>
          <div class="dropdown-content" id="category-filter">
            <a href="#" data-category="all">Всі</a>
            <a href="#" data-category="numerical">Числові</a>
            <a href="#" data-category="game">Ігри</a>
            <a href="#" data-category="acquaintance">Знайомство</a>
          </div>
        </div>
        <button id="open-welcome-modal">Ввести ім'я</button>
      </div>
    </header>

    <main class="container">
      <section class="games-grid" id="games-container">
        <!-- Картки генеруються JS -->
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2024 Мій Ігровий Проєкт</p>
        <form id="subscribe-form">
          <input type="email" placeholder="Ваш email" required />
          <button type="submit">Підписатися</button>
        </form>
      </div>
    </footer>

    <!-- Модальне вікно привітання -->
    <div id="welcome-modal" class="modal">
      <div class="modal-content">
        <span class="close" id="close-welcome">&times;</span>
        <h2>Як вас звати?</h2>
        <input type="text" id="user-name-input" placeholder="Введіть ім'я" />
        <button id="save-name">Зберегти</button>
      </div>
    </div>

    <!-- Модальне вікно підписки -->
    <div id="subscribe-modal" class="modal">
      <div class="modal-content">
        <span class="close" id="close-subscribe">&times;</span>
        <h2>Дякуємо за підписку!</h2>
        <p>Ви отримаєте свіжі новини першими.</p>
      </div>
    </div>

    <!-- Контейнер для ігор (динамічний контент) -->
    <div id="game-overlay" class="modal">
      <div class="modal-content game-content" id="game-zone">
        <span class="close" id="close-game">&times;</span>
        <div id="game-interface"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
